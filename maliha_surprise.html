<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>I love you Maliha — Surprise</title>
<style>
* {box-sizing: border-box; margin: 0; padding: 0;}
html,body {height:100%;}
body {
font-family: "Segoe UI", Roboto, "Noto Sans Bengali", sans-serif;
overflow: hidden;
height: 100vh;
background: linear-gradient(120deg, #0f172a, #0b3d91 30%, #6b0f1a 60%, #2a2a72 100%);
animation: bgShift 10s linear infinite;
display: grid;
place-items: center;
}
@keyframes bgShift {
0% { filter: hue-rotate(0deg) saturate(100%); transform: scale(1); }
50% { filter: hue-rotate(45deg) saturate(120%); transform: scale(1.03); }
100% { filter: hue-rotate(0deg) saturate(100%); transform: scale(1); }
}
body::before, body::after {
content: "";
position: absolute;
width: 60vmax;
height: 60vmax;
left: -10vmax;
top: -20vmax;
background: radial-gradient(circle at 30% 30%, rgba(255,120,120,0.12), transparent 25%),
radial-gradient(circle at 70% 70%, rgba(100,180,255,0.12), transparent 25%),
radial-gradient(circle at 50% 50%, rgba(180,255,150,0.08), transparent 25%);
filter: blur(60px);
animation: floaty 12s linear infinite;
pointer-events: none;
z-index: 0;
}
body::after { left: auto; right: -10vmax; top: 10vmax; transform: rotate(18deg); animation-duration: 18s; }
@keyframes floaty {
0% { transform: translateY(0) scale(1) rotate(0deg); opacity: 1; }
50% { transform: translateY(-6vmin) scale(1.06) rotate(6deg); opacity: 0.95; }
100% { transform: translateY(0) scale(1) rotate(0deg); opacity: 1; }
}
.card {
position: relative;
z-index: 5;
text-align: center;
width: min(92vw, 860px);
padding: 2.5rem;
border-radius: 18px;
backdrop-filter: blur(6px) saturate(120%);
background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.02));
box-shadow: 0 10px 40px rgba(2,6,23,0.6), inset 0 1px 0 rgba(255,255,255,0.02);
}
.title {
color: rgba(255,255,255,0.95);
font-size: clamp(1.1rem, 2.6vw, 1.5rem);
margin-bottom: 1.25rem;
letter-spacing: 0.6px;
}
.btn {
display: inline-block;
cursor: pointer;
font-weight: 700;
color: white;
padding: 0.9rem 1.6rem;
border-radius: 50px;
border: none;
background: linear-gradient(90deg, #ff4d6d, #ff974a 40%, #ffd54a 100%);
box-shadow: 0 8px 30px rgba(255,150,110,0.18);
transition: transform .12s ease, box-shadow .12s ease;
font-size: clamp(0.95rem, 2.4vw, 1.1rem);
}
.message {
margin-top: 2rem;
font-weight: 800;
font-size: clamp(2.2rem, 6.6vw, 5rem);
color: white;
letter-spacing: 1px;
opacity: 0;
transform: translateY(12px) scale(0.96);
transition: opacity .5s ease .05s, transform .5s cubic-bezier(.2,.9,.2,1);
text-align: center;
pointer-events: none;
}
.message.show {
opacity: 1;
transform: translateY(0) scale(1);
}
.neon {
background: linear-gradient(90deg, #ff7aa2, #ffd36e, #8bf6ff, #b58bff);
-webkit-background-clip: text;
background-clip: text;
color: transparent;
}
#fireCanvas {
position: fixed;
left: 0; top: 0;
width: 100%; height: 100%;
z-index: 3;
pointer-events: none;
}
</style>
</head>
<body>
<div class="card">
<div class="title">Hey Dear Maliha. How are yoy beb?</div>
<button id="actionBtn" class="btn">Click on me</button>
<div id="msg" class="message"><span class="neon">I love you Maliha</span></div>
</div>
<script>
// Minimal script for reveal
document.getElementById("actionBtn").onclick = () => {
document.getElementById("msg").classList.add("show");
};
</script>
</body>
</html>
